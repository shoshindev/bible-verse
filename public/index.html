<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <figure>
        <figcaption id="verse-info">
          <span id="verse-book">Thessalonians</span>
          <span id="verse-number">119:176</span>
        </figcaption>

        <blockquote id="verse-text">
          Come to Me, all you who are weary and burdened, and I will give you
          rest.
        </blockquote>
      </figure>
    </main>
  </body>
</html>
